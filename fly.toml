# Establo — Fly.io configuration. See DEPLOY.md for the full walkthrough.
app = "establo"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  RUN_MODE = "production"
  PORT = "8787"
  DATA_DIR = "/data/storage"
  # PUBLIC_BASE_URL is set via `fly secrets` (or here) once you know the URL:
  # PUBLIC_BASE_URL = "https://establo.fly.dev"

[http_service]
  internal_port = 8787
  force_https = true
  # The drip scheduler (pg-boss cron) lives inside this process —
  # it must NOT scale to zero or scheduled modules stop going out.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "establo_data"
  destination = "/data"

[deploy]
  release_command = "pnpm migrate"
