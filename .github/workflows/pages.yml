# Deploys the static demo (in-browser mock API + sample data) to GitHub Pages
# on every push to main, by publishing the build to the gh-pages branch
# (GitHub auto-publishes that branch — no manual Pages setup needed).
# The full application (Claude answers, voice notes, real WhatsApp, Postgres)
# runs via `pnpm dev` locally or Fly.io — see README.
name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:demo
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/demo
          commit_message: 'Deploy static demo (${{ github.sha }})'
